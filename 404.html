<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'self';
  object-src 'none';
  img-src 'self' data:;
  style-src 'self' 'unsafe-inline';
  script-src 'self';
  connect-src 'none';
  form-action 'self';
  upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F0E8">
<meta name="robots" content="noindex">
<title>Page introuvable — Maison 1866</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%23F5F0E8'/><text x='32' y='42' font-family='Georgia,serif' font-size='21' letter-spacing='-1' fill='%23151515' text-anchor='middle'>1866</text></svg>">
<style>
:root{
  --bg:#F5F0E8;--ink:#151515;--ink-2:#5C564F;--ink-3:#6D675F;
  --accent-deep:#806240;--line:rgba(21,21,21,.12);
  --serif:"Hoefler Text","Baskerville","Times New Roman",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Arial,sans-serif;
  --e-out:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:40px clamp(18px,5vw,64px);overflow-x:hidden;
  -webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.eyebrow{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--accent-deep)}
.code{font-family:var(--serif);font-size:clamp(90px,26vw,220px);line-height:.9;
  letter-spacing:-.04em;margin:18px 0 6px}
h1{font-family:var(--serif);font-weight:400;font-size:clamp(24px,6vw,38px);
  letter-spacing:-.02em;line-height:1.1}
p{margin-top:18px;max-width:40ch;color:var(--ink-2);font-size:15px;line-height:1.75}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:34px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:54px;padding:0 30px;
  background:var(--ink);color:var(--bg);font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;transition:opacity .3s}
.btn:hover{opacity:.86}
.btn-line{display:inline-flex;align-items:center;min-height:54px;
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);
  border-bottom:1px solid var(--line)}
footer{margin-top:52px;font-size:11px;letter-spacing:.1em;color:var(--ink-3)}
:focus-visible{outline:2px solid var(--accent-deep);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
  <div class="eyebrow">Maison 1866</div>
  <div class="code">404</div>
  <h1>Cette page s'est tue.</h1>
  <p>Le lien que vous suivez n'existe pas, ou plus. Chapter I, lui, est toujours là.</p>
  <div class="actions">
    <a class="btn" href="/">Retour à l'accueil</a>
    <a class="btn-line" href="/#shop">Voir l'Abyss Tee</a>
  </div>
  <footer>Made for silence.</footer>
</body>
</html>
